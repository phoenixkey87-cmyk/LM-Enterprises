<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Just a Quick Nap logo, concept A: Pod Moon">
  <title>Just a Quick Nap, concept A: Pod Moon</title>
  <rect width="480" height="300" fill="#FFF8EC"/>
  <!-- pod capsule -->
  <rect x="90" y="40" width="300" height="130" rx="65" fill="#14284B"/>
  <rect x="108" y="58" width="264" height="94" rx="47" fill="#1D3A6B"/>
  <!-- crescent moon -->
  <circle cx="190" cy="105" r="34" fill="#FFE9B8"/>
  <circle cx="204" cy="96" r="30" fill="#1D3A6B"/>
  <!-- sleeping Zs -->
  <text x="270" y="118" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="34" fill="#FFB74D">z</text>
  <text x="302" y="96" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="26" fill="#FFCC80">z</text>
  <text x="328" y="78" font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="19" fill="#FFE0B2">z</text>
  <!-- wordmark -->
  <text x="240" y="232" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="bold" font-size="38" fill="#14284B">Just a Quick Nap</text>
  <text x="240" y="262" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="16" letter-spacing="3" fill="#6B7A99">REST BETWEEN FLIGHTS</text>
</svg>
