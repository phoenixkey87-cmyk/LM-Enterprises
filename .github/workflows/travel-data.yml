name: Refresh travel data

on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mon and Thu, 09:17 UTC (free-plan sized)
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Override MAX_CALLS_PER_RUN for this run (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: travel-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install jsonschema

      - name: Unit tests (mocked SerpApi responses)
        run: python -m unittest discover -s tests

      - name: Show planned SerpApi calls
        run: python scripts/fetch_travel_data.py --plan
        env:
          MAX_CALLS_PER_RUN: ${{ inputs.max_calls }}

      - name: Fetch from SerpApi
        run: python scripts/fetch_travel_data.py
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          MAX_CALLS_PER_RUN: ${{ inputs.max_calls }}

      - name: Validate JSON against schemas
        run: python scripts/validate_data.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh travel data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
